<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>مكتب الأستاذ محسن المخفي — هيئة المحامين بفاس</title>
<link rel="icon" href="assets/logo.png">
<meta name="theme-color" content="#17324d">
<style>
  :root{--navy:#17324d;--brass:#a87c3f;--paper:#fbfaf6;--muted:#5b6b7b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--paper);color:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  main{max-width:560px;width:100%;border-top:4px solid var(--brass);background:#fff;box-shadow:0 10px 30px rgba(15,35,56,.08);padding:48px 28px 40px}
  img{width:96px;height:96px;object-fit:contain;margin-bottom:18px}
  h1{font-size:22px;line-height:1.6;font-weight:800}
  .t2{display:block;font-size:16px;color:var(--brass);font-weight:600;margin-top:4px}
  .bar{margin-top:14px;font-size:14px;color:var(--muted)}
  hr{border:0;border-top:1px solid #e3e8ee;margin:26px auto;width:60%}
  p{font-size:15px;color:var(--muted);line-height:1.9}
  .fr{margin-top:22px;font-size:13px;color:#8a97a5;direction:ltr}
</style>
</head>
<body>
<main>
  <img src="assets/logo.png" alt="" onerror="this.remove()">
  <h1>مكتب الأستاذ محسن المخفي<span class="t2">للمحاماة والاستشارات القانونية</span></h1>
  <div class="bar">هيئة المحامين بفاس — صفرو</div>
  <hr>
  <p>الموقع الإلكتروني قيد الإعداد.</p>
  <div class="fr">Maître Mouhsine El Makhfi — Ordre des avocats de Fès<br>Site en cours de préparation.</div>
</main>
</body>
</html>
